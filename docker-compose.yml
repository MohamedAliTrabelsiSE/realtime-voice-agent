services:
  voice-agent:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Override in .env for real deployments.
      VOICE_TOKEN_SECRET: ${VOICE_TOKEN_SECRET:-change-me-to-a-long-random-string}
    restart: unless-stopped
